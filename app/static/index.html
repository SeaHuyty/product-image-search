<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fashion Search</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <h1 class="logo">Fashion Search</h1>

    <form id="search-form" class="search-box" autocomplete="off">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>

      <input id="query" type="text" maxlength="200" placeholder="Search by description, e.g. red dress" aria-label="Search by text">

      <div id="preview" class="preview" hidden>
        <img id="preview-img" alt="Selected image">
        <span id="preview-name"></span>
        <button id="clear-image" type="button" class="icon-btn" aria-label="Remove image">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
          </svg>
        </button>
      </div>

      <button id="pick-image" type="button" class="icon-btn" aria-label="Search by image" title="Search by image">
        <svg class="icon camera" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4z"/>
          <path d="M9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/>
        </svg>
      </button>
      <input id="file" type="file" accept="image/*" hidden>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="results" class="results" aria-label="Search results"></section>
  </main>
</body>
</html>
